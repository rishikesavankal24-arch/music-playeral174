<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="music-player">
        
        <div class="header">
            <span>NOW PLAYING</span>
            <i class="fas fa-chevron-down"></i>
        </div>

        <div class="album-cover">
            <img src="images.jpg" alt="Laura Tesoro - Higher Album Art">
        </div>

        <div class="track-info">
            <h2>Higher</h2>
            <p>Laura Tesoro</p>
        </div>

        <div class="progress-container">
            <span class="curr-time">0:00</span>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <span class="total-time">3:45</span>
        </div>

        <div class="controls">
            <i class="fas fa-random" title="Shuffle"></i>
            <i class="fas fa-step-backward" title="Previous"></i>
            
            <div class="play-pause">
                <i class="fas fa-play"></i>
            </div>
            
            <i class="fas fa-step-forward" title="Next"></i>
            <i class="fas fa-redo" title="Repeat"></i>
        </div>

    </div>

</body>
</html>
